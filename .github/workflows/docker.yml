name: Docker

on:
  pull_request:
    branches: [dev, main]
    paths: ['frontend/**', 'backend/**', 'docker-compose.yml', '.github/workflows/docker.yml']
  push:
    branches: [dev]
    paths: ['frontend/**', 'backend/**', 'docker-compose.yml', '.github/workflows/docker.yml']
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: docker-build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: frontend
          - name: api
            context: backend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (push only)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags from Git
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sidas200/tdimp-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - name: Build (and push outside PRs)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}