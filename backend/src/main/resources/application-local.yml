# Perfil local: PostgreSQL instalado en tu computadora (base tdimp).
# Lee backend/.env si existe (no se sube a git): ahí cada quien pone su puerto o su base.
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tdimp}
    username: ${DB_USER:tdimp}
    password: ${DB_PASSWORD:tdimp}

tdimp:
  security:
    jwt-secret: ${JWT_SECRET:local-only-secret-change-me-0123456789abcdef}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  file:
    name: logs/tdimp-api.log
  pattern:
    level: "%5p [req=%X{requestId:-}]"
  level:
    mx.utch.tdimp.api: DEBUG
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    com.zaxxer.hikari: INFO
    com.zaxxer.hikari.pool.HikariPool: DEBUG
    org.flywaydb: INFO