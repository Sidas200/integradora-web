spring:
  application:
    name: tdimp-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      schema: game
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: game
  flyway:
    enabled: true
    schemas: game
    locations: classpath:db/migration
    # Flyway usa el rol dueño del esquema (DDL); si no se indica, el mismo usuario de la API.
    user: ${DB_MIGRATION_USER:${spring.datasource.username}}
    password: ${DB_MIGRATION_PASSWORD:${spring.datasource.password}}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /v3/api-docs

tdimp:
  security:
    # Sin valor por defecto: en staging y producción la API no arranca si falta JWT_SECRET.
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d