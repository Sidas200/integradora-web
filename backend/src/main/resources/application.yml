spring:
  application:
    name: tdimp-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      schema: game
  flyway:
    enabled: true
    schemas: game
    locations: classpath:db/migration
    # Flyway usa el rol dueño del esquema (DDL); si no se indica, el mismo usuario de la API.
    user: ${DB_MIGRATION_USER:${spring.datasource.username}}
    password: ${DB_MIGRATION_PASSWORD:${spring.datasource.password}}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

tdimp:
  security:
    # Sin valor por defecto: en staging y producción la API no arranca si falta JWT_SECRET.
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  # Límite de intentos (README §10). Al pasarse: 429 TOO_MANY_ATTEMPTS con Retry-After.
  rate-limit:
    enabled: true
    login:            # por IP + correo; un login correcto reinicia la cuenta
      max-attempts: 5
      window: 15m
    register:         # por IP
      max-attempts: 10
      window: 1h
    reauthenticate:   # por jugador; una contraseña correcta reinicia la cuenta
      max-attempts: 5
      window: 15m
    subscriptions:    # por IP, formulario público del aviso de lanzamiento
      max-attempts: 10
      window: 1h